# Run from the version tag of a merged commit: every job of the test workflow runs again before publishing.
# PyPI trusted publisher: anyact-ai/world-use, workflow release.yml, environment pypi. No package is
# published by the PR workflow.
name: release
on:
  workflow_dispatch:
jobs:
  test:
    uses: ./.github/workflows/test.yml
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Require a matching version tag
        run: |
          uv run --no-project python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF'] == f'refs/tags/v{version}', 'Run the release from its matching version tag'
          PY
      - run: uv build
      - run: uv publish --trusted-publishing always
