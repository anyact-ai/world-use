# Publishes a tagged version to PyPI: gh workflow run release.yml --ref v0.2.0
# It needs a trusted publisher on PyPI first (project world-use, owner anyact-ai, repository world-use,
# workflow release.yml, environment pypi), so no token is stored anywhere.
name: release
on:
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uv publish --trusted-publishing always
