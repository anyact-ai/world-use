name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python 3.13
      - name: Install the optional CPU vision stack
        run: uv pip install --python .venv/bin/python --torch-backend cpu --editable '.[vision]'
      - name: Check types with vision dependencies installed
        run: .venv/bin/ty check src
      - name: Install headless rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Validate real EdgeTAM, Python and MCP procedures, recovery and Rerun
        run: .venv/bin/python scripts/vision_smoke.py --output runs/vision-ci
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vision-evidence
          path: runs/vision-ci
          if-no-files-found: warn
          retention-days: 14
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ty check src
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest       # the oldest supported Python
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Install headless rendering libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - name: Test including MuJoCo rendering
        if: runner.os == 'Linux'
        run: uv run pytest
      # Hosted macOS VMs have no accelerated OpenGL for MuJoCo's CGL backend.
      # https://github.com/google-deepmind/mujoco/issues/959
      - name: Test without GPU-dependent rendering
        if: runner.os == 'macOS'
        run: uv run pytest -m 'not rendering'
      - run: uv run python examples/adapters/planar.py
      - name: Verify the installed wheel and packaged resources
        shell: bash
        run: |
          uv build
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/wheel-test"
          for task_wheel in dist/*.whl; do
            uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" "${task_wheel}[mcp,rerun]"
          done
          task_camera_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            task_camera_args+=(--file-camera)
          fi
          "$RUNNER_TEMP/wheel-test/bin/python" scripts/wheel_smoke.py "${task_camera_args[@]}"
      # motorbridge 0.5.5 has macOS and Linux wheels up to Python 3.13, none for 3.14.
      - name: Load the published hardware driver without opening CAN
        shell: bash
        run: |
          for task_wheel in dist/*.whl; do
            uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" "${task_wheel}[rebot]"
          done
          "$RUNNER_TEMP/wheel-test/bin/python" -c 'from motorbridge.abi import get_abi; get_abi()'
