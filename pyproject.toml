[project]
name = "world-use"
version = "0.2.0.dev0"
description = "Run frontier models as robot policies: a safety kernel, checked plans and compact context for LLM-operated robots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Dmytro Hrybov" }]
keywords = ["robotics", "llm", "agents", "policy", "robot-arm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "pillow>=10.1"]

[project.optional-dependencies]
rebot = ["motorbridge==0.5.5"]
mcp = ["mcp>=2.2"]

[project.scripts]
wu = "world_use.cli:main"

[project.urls]
Repository = "https://github.com/anyact-ai/world-use"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "ty>=0.0.84", "mcp>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_use"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF005", "RUF012"]    # tuple concatenation reads fine; behavior examples are class-level constants

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
