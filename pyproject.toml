[project]
name = "world-use"
version = "0.3.0"
description = "Robot control for AI agents: checked plans, a persistent runtime, and compact execution feedback."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Dmytro Hrybov" }]
keywords = ["robotics", "llm", "agents", "policy", "robot-arm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "pillow>=10.1"]

[project.optional-dependencies]
rebot = ["motorbridge==0.5.5"]
mcp = ["mcp>=2.2"]
vision = ["torch==2.14.0", "torchvision==0.29.1", "transformers==5.15.1", "timm>=1.0.30,<2"]

[project.scripts]
wu = "world_use.cli:main"

[project.urls]
Repository = "https://github.com/anyact-ai/world-use"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "ty>=0.0.84", "mcp>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_use"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF005", "RUF012"]    # tuple concatenation reads fine; behavior examples are class-level constants

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
