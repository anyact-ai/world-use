[project]
name = "world-use"
version = "0.1.0.dev0"
description = "Run frontier models as robot policies: a safety kernel, checked plans and compact context for LLM-operated robots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Dmytro Hrybov" }]
keywords = ["robotics", "llm", "agents", "policy", "robot-arm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
rebot = ["motorbridge==0.5.5"]

[project.scripts]
wu = "world_use.cli:main"

[project.urls]
Repository = "https://github.com/dimentary/world-use"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
