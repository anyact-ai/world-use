# Copy this file, then choose the CAN channel and one camera source for your setup.
body = "rebot"

[body_options]
channel = "can0"                     # Linux SocketCAN; macOS maps can0 to PCAN_USBBUS1

[[camera]]
name = "side"
path = "/tmp/world-use-side.jpg"     # a capture process must replace this file with fresh frames
max_age_s = 3
# Replace path/max_age_s with one of these sources if preferred (docs/rebot.md shows how to pick the camera):
# command = "ffmpeg -loglevel error -f avfoundation -framerate 30 -i 0 -frames:v 1 -f image2pipe -c:v png -"  # macOS
# command = "ffmpeg -loglevel error -f video4linux2 -i /dev/video0 -frames:v 1 -f image2pipe -c:v png -"     # Linux
# url = "http://CAMERA/snapshot.jpg"
# Add calibration only after measuring it; an uncalibrated camera shows the raw image.
# Do not copy the simulation's tray/block coordinates into a physical workcell.
